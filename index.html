<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b37"><meta name="description" content="성인용 2분 집중 게임 세 가지"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><title>집중 실험실 · 6호</title></head><body><main class="shell"><header><div class="brand"><span class="mark">✳</span><span>6호 · 집중 실험실</span></div><span class="pill">2분 게임</span></header><section id="start" class="panel intro"><div class="eyebrow">FOCUS LAB / THREE GAMES</div><h1>집중 실험실<span class="dot">.</span></h1><p class="lead">방해를 무시하고,<br><strong>지금의 규칙에 집중하세요.</strong></p><div class="mode-list"><button type="button" data-mode="stroop" class="mode"><span class="mode-num">01</span><span><strong>색 vs 글자</strong><small>글자 뜻 대신 글씨 색을 고르세요.</small></span><span>↗</span></button><button type="button" data-mode="flanker" class="mode"><span class="mode-num">02</span><span><strong>가운데 화살표</strong><small>주변 화살표는 무시하세요.</small></span><span>↗</span></button><button type="button" data-mode="switch" class="mode"><span class="mode-num">03</span><span><strong>규칙 전환</strong><small>글씨 색 ↔ 글자 뜻이 바뀝니다.</small></span><span>↗</span></button></div><div id="selected" class="selection" hidden><p id="instruction"></p><p id="best" class="best"></p><button id="play" class="primary" hidden>2분 시작 <span>↗</span></button></div><p class="fine">기록은 기기에만 저장됩니다. 의료 검사나 집중력 향상 판정이 아닙니다.</p></section><section id="game" hidden><div class="status"><div><small>남은 시간</small><strong id="clock">02:00</strong></div><div><small>정답</small><strong id="correct">0</strong></div><div><small>오답</small><strong id="wrong">0</strong></div></div><div class="progress"><span id="bar"></span></div><div class="challenge"><span id="mode-title"></span><div class="rule-banner">현재 규칙: <strong id="rule"></strong></div><div id="stimulus" class="s
